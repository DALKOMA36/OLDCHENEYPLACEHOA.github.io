<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0a0e17" />
    <meta name="description" content="Jarvis - Your personal AI life manager with calendar, tasks, train tracking, meals, and more." />
    <title>J.A.R.V.I.S. Interface</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/svg+xml" href="./icon-192.svg" />
    <link rel="apple-touch-icon" href="./icon-192.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600;700&family=Exo+2:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #0a0e17; overflow-x: hidden; -webkit-tap-highlight-color: transparent; font-family: 'Exo 2', 'Rajdhani', -apple-system, BlinkMacSystemFont, sans-serif; transition: background 0.3s; }
      @media (prefers-color-scheme: light) { body { background: #f0f2f5; } }
      #root { min-height: 100vh; min-height: 100dvh; }
    </style>
  </head>
  <body>
    <div id="root"><p style="color:#4de8ff;padding:40px;font-family:'JetBrains Mono',monospace;font-size:13px">INITIALIZING J.A.R.V.I.S. ...</p></div>
    <script>
      window.onerror = function(msg, url, line, col, err) {
        document.getElementById('root').innerHTML = '<pre style="color:#ff3d3d;padding:40px;font-family:\'JetBrains Mono\',monospace;white-space:pre-wrap;font-size:12px">SYSTEM ERROR: ' + msg + '\n' + (url||'') + ':' + line + '\n' + (err&&err.stack||'') + '</pre>';
      };
      window.addEventListener('unhandledrejection', function(e) {
        document.getElementById('root').innerHTML = '<pre style="color:#ff3d3d;padding:40px;font-family:\'JetBrains Mono\',monospace;white-space:pre-wrap;font-size:12px">PROMISE ERROR: ' + (e.reason&&e.reason.message||e.reason||'unknown') + '\n' + (e.reason&&e.reason.stack||'') + '</pre>';
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(function() {});
      }
    </script>
  </body>
</html>
